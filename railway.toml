# NOT READ BY RAILWAY. Railway deprecated railway.toml (config as code) in
# favour of .railway/railway.ts; this service never used it. The settings
# below are set on the service itself (Railway → api → Settings, 2026-10-22):
# Dockerfile build (Dockerfile path set), watch paths, pre-deploy migrations,
# /health check, restart on failure (3). Keep this file in step with the
# dashboard as a record until we move to .railway/railway.ts.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Web-only pushes don't rebuild the API.
watchPatterns = [
  "services/api/**",
  "packages/shared/**",
  "packages/content/**",
  "Dockerfile",
  "railway.toml",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
  "tsconfig.base.json",
]

[deploy]
# Migrate before the new version takes traffic; a failed migration stops the deploy.
preDeployCommand = ["pnpm --filter @octonote/api db:migrate:deployed"]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 60
